<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轨迹分段分析器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;--bg:#101419;--panel:#182129;--edge:#2b3a46;--blue:#2d9cff;--orange:#ff9d17;--muted:#9cadba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eaf0f4;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{height:60px;background:#151c22;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:11px;padding:11px 16px;flex-wrap:wrap}h1{font-size:17px;margin:0 10px 0 0}.btn,label.btn{padding:7px 10px;border:1px solid #405767;border-radius:6px;background:#20323e;color:#edf6fb;cursor:pointer}.btn:hover,label.btn:hover{background:#294757}input[type=file]{display:none}.hint{font-size:12px;color:var(--muted)}.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:minmax(420px,1fr) 345px;grid-template-rows:minmax(280px,1fr) 255px;gap:8px;padding:8px}.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;overflow:hidden}#map{grid-row:1;grid-column:1}.side{grid-row:1 / span 2;grid-column:2;padding:14px;overflow:auto}.profile{grid-row:2;grid-column:1;padding:9px 12px}.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.bar b{font-size:14px}.modes{display:flex;gap:5px}.mode{border:1px solid var(--edge);background:#12191e;color:#afbfca;border-radius:5px;padding:3px 7px;cursor:pointer}.mode.active{color:#fff;border-color:var(--blue);background:#1c405d}canvas{width:100%;height:198px;display:block;cursor:crosshair;touch-action:none}.notice{padding:9px 10px;border-left:3px solid var(--blue);background:#13242d;border-radius:4px;color:#d2dfe7;font-size:12px}.warn{border-left-color:var(--orange);background:#2b2112;margin-top:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}#cursorStats{min-height:92px;align-content:start}.stat{background:#11181e;border:1px solid #263641;border-radius:6px;padding:8px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:15px}.section{font-size:12px;font-weight:700;letter-spacing:.07em;color:#b8c8d3;margin:16px 0 7px}.stops{display:flex;flex-direction:column;gap:5px}.stop{border:1px solid #34434d;border-radius:5px;background:#12191e;padding:7px;font-size:12px;cursor:pointer}.stop:hover{border-color:var(--orange)}.legend{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:11px;height:3px;background:var(--blue);vertical-align:middle;margin:0 3px}.dot.o{background:var(--orange)}@media(max-width:820px){header{height:auto}.layout{height:auto;min-height:calc(100vh - 100px);grid-template-columns:1fr;grid-template-rows:42vh 240px auto;padding:6px}#map{grid-row:1;grid-column:1}.profile{grid-row:2;grid-column:1}.side{grid-row:3;grid-column:1}}
</style></head><body>
<header><h1>轨迹分段分析器</h1><label class="btn">打开 KML / GPX / FIT<input id="file" type="file" accept=".kml,.gpx,.fit,application/xml,text/xml,application/octet-stream"></label><button class="btn" id="reset">清除选段</button><span class="hint">在剖面图拖拽选择区间；文件只在本机浏览器内解析。</span></header>
<main class="layout"><div id="map" class="card"></div><aside class="side card"><div id="status" class="notice">选择 KML、GPX 或 FIT 活动文件。支持时间、经纬度、海拔与速度字段的自动识别。</div><div id="warnings"></div><div class="section">所选区间</div><div class="stats" id="stats"></div><div class="section">游标所在点</div><div class="stats" id="cursorStats"></div><div class="section">自动识别停留点</div><div id="stops" class="stops"><span class="hint">加载轨迹后显示。规则：半径 50 m 内停留至少 3 分钟。</span></div><div class="section">口径</div><div class="hint">距离使用 WGS84 大圆距离。爬升和下降按相邻有效海拔差累计。移动时间会排除相邻点间隔超过 5 分钟的时段；停留点只作提示，GPS 漂移或采样中断可能造成误判。</div></aside><section class="profile card"><div class="bar"><b>海拔剖面</b><div><button class="mode active" id="distMode">按距离</button><button class="mode" id="timeMode">按时间</button><span class="legend"><i class="dot"></i>全程 <i class="dot o"></i>选段</span></div></div><canvas id="chart"></canvas></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fit-file-parser@2.1.0/dist/fit-file-parser.js"></script>
<script>
'use strict';
const map=L.map('map',{preferCanvas:true}).setView([30,104],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const C=document.getElementById('chart'),X=C.getContext('2d'),status=document.getElementById('status'),warnings=document.getElementById('warnings'),stats=document.getElementById('stats'),cursorStats=document.getElementById('cursorStats'),stopsEl=document.getElementById('stops');
let pts=[],range=null,hover=null,axis='distance',allLine,selLine,ends,hoverMark,stopLayer;
const pause=300,stopRadius=50,stopMin=180;
const fmtN=n=>Number.isFinite(n)?n.toLocaleString('zh-CN',{maximumFractionDigits:0}):'—';
const fmtD=m=>!Number.isFinite(m)?'—':m>=1000?(m/1000).toFixed(m>=10000?1:2)+' km':Math.round(m)+' m';
const fmtT=s=>{if(!Number.isFinite(s))return '无时间数据';s=Math.max(0,Math.round(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return h?`${h}时${m}分`:(m?`${m}分${q}秒`:`${q}秒`)};
const fmtV=v=>Number.isFinite(v)?v.toFixed(1)+' km/h':'—';
function hav(a,b){const R=6371008.8,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lng-a.lng)*r,z=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(z),Math.sqrt(1-z));}
function prepare(){let d=0;pts.forEach((p,i)=>{if(i)d+=hav(pts[i-1],p);p.dist=d});}
function val(i){if(axis==='time'&&pts[0]?.time&&pts[i]?.time)return pts[i].time-pts[0].time;return pts[i]?.dist||0}
function maxVal(){return val(pts.length-1)||1}
function indexAt(v){let lo=0,hi=pts.length-1;while(lo<hi){let mid=(lo+hi)>>1;if(val(mid)<v)lo=mid+1;else hi=mid}if(lo>0&&Math.abs(val(lo-1)-v)<Math.abs(val(lo)-v))return lo-1;return lo}
function getRange(){return range||[0,Math.max(0,pts.length-1)]}
function calculate(a,b){let d=0,up=0,down=0,elapsed=NaN,moving=NaN;if(!pts.length)return{d,up,down,elapsed,moving};let start=pts[a].time,end=pts[b].time;if(start&&end)elapsed=Math.max(0,(end-start)/1000);let mt=0,has=false;for(let i=a+1;i<=b;i++){let p=pts[i-1],q=pts[i],seg=hav(p,q);d+=seg;if(Number.isFinite(p.ele)&&Number.isFinite(q.ele)){let z=q.ele-p.ele;if(z>0)up+=z;else down-=z}if(p.time&&q.time){let t=(q.time-p.time)/1000;if(t>=0&&t<=pause){mt+=t;has=true}}}moving=has?mt:NaN;return{d,up,down,elapsed,moving}}
function cells(items){return items.map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('')}
function drawStats(){if(!pts.length){stats.innerHTML='';cursorStats.innerHTML='';return}let[a,b]=getRange(),s=calculate(a,b),avg=Number.isFinite(s.elapsed)&&s.elapsed?s.d/s.elapsed*3.6:NaN,mv=Number.isFinite(s.moving)&&s.moving?s.d/s.moving*3.6:NaN;stats.innerHTML=cells([['距离',fmtD(s.d)],['经过时间',fmtT(s.elapsed)],['移动时间',fmtT(s.moving)],['平均速度',fmtV(avg)],['移动均速',fmtV(mv)],['累计爬升',fmtN(s.up)+' m'],['累计下降',fmtN(s.down)+' m'],['海拔',fmtN(pts[a].ele)+' → '+fmtN(pts[b].ele)+' m'],['起点时间',pts[a].time?pts[a].time.toLocaleString():'—'],['终点时间',pts[b].time?pts[b].time.toLocaleString():'—']]);drawCursor();}
function drawCursor(){if(hover==null||!pts[hover]){cursorStats.innerHTML='<span class="hint">在剖面图上移动鼠标，读取对应轨迹点。</span>';return}let p=pts[hover],prev=pts[Math.max(0,hover-1)],speed=Number.isFinite(p.speed)?p.speed:(p.time&&prev.time&&hover?hav(prev,p)/((p.time-prev.time)/1000)*3.6:NaN);cursorStats.innerHTML=cells([['累计距离',fmtD(p.dist)],['记录时间',p.time?p.time.toLocaleString():'无时间数据'],['海拔',fmtN(p.ele)+' m'],['速度',fmtV(speed)],['坐标',`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`]]);}
function size(){let r=C.getBoundingClientRect(),q=devicePixelRatio||1;C.width=Math.max(1,Math.round(r.width*q));C.height=Math.max(1,Math.round(r.height*q));X.setTransform(q,0,0,q,0,0);return{w:r.width,h:r.height}}
function draw(){let{w,h}=size();X.clearRect(0,0,w,h);if(pts.length<2){X.fillStyle='#9cadba';X.textAlign='center';X.fillText('打开轨迹文件后，在这里查看海拔、时间或距离',w/2,h/2);return}let es=pts.map(p=>p.ele).filter(Number.isFinite);if(!es.length){X.fillStyle='#9cadba';X.textAlign='center';X.fillText('没有海拔信息，无法展示海拔剖面',w/2,h/2);return}let lo=Math.min(...es),hi=Math.max(...es),pd=(hi-lo||10)*.07;lo-=pd;hi+=pd;let y=e=>h-14-(e-lo)/(hi-lo)*(h-32),xx=i=>val(i)/maxVal()*w;X.strokeStyle='#34454f';X.beginPath();X.moveTo(0,h-14);X.lineTo(w,h-14);X.stroke();X.beginPath();pts.forEach((p,i)=>i?X.lineTo(xx(i),y(Number.isFinite(p.ele)?p.ele:lo)):X.moveTo(xx(i),y(Number.isFinite(p.ele)?p.ele:lo)));X.strokeStyle='#2d9cff';X.lineWidth=1.6;X.stroke();let[a,b]=getRange();X.fillStyle='rgba(255,157,23,.13)';X.fillRect(xx(a),0,xx(b)-xx(a),h);X.beginPath();for(let i=a;i<=b;i++){let yy=y(Number.isFinite(pts[i].ele)?pts[i].ele:lo);i===a?X.moveTo(xx(i),yy):X.lineTo(xx(i),yy)}X.strokeStyle='#ff9d17';X.lineWidth=2.8;X.stroke();if(hover!=null){X.setLineDash([4,4]);X.strokeStyle='#d7e1e7';X.lineWidth=1;X.beginPath();X.moveTo(xx(hover),0);X.lineTo(xx(hover),h);X.stroke();X.setLineDash([]);X.fillStyle='#d7e1e7';X.textAlign='left';let label=axis==='time'&&pts[hover].time?pts[hover].time.toLocaleTimeString():fmtD(pts[hover].dist);X.fillText(label,Math.min(w-90,xx(hover)+5),13)}X.fillStyle='#9cadba';X.textAlign='left';X.fillText(Math.round(hi)+' m',4,12);X.fillText(Math.round(lo)+' m',4,h-17)}
function mapUpdate(fit=false){if(!pts.length)return;let[a,b]=getRange(),ll=pts.map(p=>[p.lat,p.lng]);[allLine,selLine,ends,hoverMark].forEach(x=>x&&map.removeLayer(x));allLine=L.polyline(ll,{color:'#2d9cff',weight:3,opacity:.75}).addTo(map);selLine=L.polyline(ll.slice(a,b+1),{color:'#ff9d17',weight:5}).addTo(map);ends=L.layerGroup([L.circleMarker(ll[a],{radius:6,color:'#fff',weight:2,fillColor:'#ff9d17',fillOpacity:1}),L.circleMarker(ll[b],{radius:6,color:'#fff',weight:2,fillColor:'#ff9d17',fillOpacity:1})]).addTo(map);if(hover!=null)hoverMark=L.circleMarker(ll[hover],{radius:7,color:'#fff',weight:2,fillColor:'#e7f2f8',fillOpacity:1}).addTo(map);if(fit)map.fitBounds(L.latLngBounds(ll),{padding:[25,25]});}
function apply(a,b){a=Math.max(0,Math.min(pts.length-1,a));b=Math.max(0,Math.min(pts.length-1,b));range=a<=b?[a,b]:[b,a];draw();mapUpdate();drawStats()}
function detectStops(){if(stopLayer)map.removeLayer(stopLayer);if(!pts.length||!pts.some(p=>p.time)){stopsEl.innerHTML='<span class="hint">没有时间信息，无法识别停留点。</span>';return}let out=[],i=0;while(i<pts.length-1){let j=i+1;while(j<pts.length&&hav(pts[i],pts[j])<=stopRadius)j++;let end=j-1;if(end>i&&pts[i].time&&pts[end].time&&(pts[end].time-pts[i].time)/1000>=stopMin){out.push({a:i,b:end,sec:(pts[end].time-pts[i].time)/1000});i=j}else i++}if(!out.length){stopsEl.innerHTML='<span class="hint">未发现超过 3 分钟、半径 50 m 内的停留。</span>';return}stopsEl.innerHTML=out.map((s,n)=>`<div class="stop" data-a="${s.a}" data-b="${s.b}"><b>停留 ${n+1}</b>　${fmtT(s.sec)}<br><span class="hint">${pts[s.a].time.toLocaleString()} · ${fmtD(pts[s.a].dist)}</span></div>`).join('');stopLayer=L.layerGroup(out.map((s,n)=>L.circleMarker([pts[s.a].lat,pts[s.a].lng],{radius:6,color:'#fff',weight:1,fillColor:'#bd64ff',fillOpacity:1}).bindPopup(`停留 ${n+1}<br>${fmtT(s.sec)}<br>${pts[s.a].time.toLocaleString()}`))).addTo(map);stopsEl.querySelectorAll('.stop').forEach(el=>el.onclick=()=>{let a=+el.dataset.a,b=+el.dataset.b;apply(a,b);map.flyTo([pts[a].lat,pts[a].lng],14)})}
function showWarnings(){let w=[];if(!pts.some(p=>Number.isFinite(p.ele)))w.push('没有海拔信息，无法展示海拔剖面和计算累计爬升。');if(!pts.some(p=>p.time))w.push('没有时间信息，无法展示时间轴、耗时、速度和自动停留点。');warnings.innerHTML=w.map(x=>`<div class="notice warn">${x}</div>`).join('')}
function eventIndex(e){let r=C.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));return indexAt(x/r.width*maxVal())}
let down=false,anchor=0;C.addEventListener('pointerdown',e=>{if(pts.length<2)return;down=true;anchor=eventIndex(e);C.setPointerCapture(e.pointerId);apply(anchor,anchor)});C.addEventListener('pointermove',e=>{if(!pts.length)return;hover=eventIndex(e);if(down)apply(anchor,hover);else{draw();mapUpdate();drawCursor()}});C.addEventListener('pointerleave',()=>{if(!down){hover=null;draw();mapUpdate();drawCursor()}});C.addEventListener('pointerup',e=>{if(down){down=false;apply(anchor,eventIndex(e))}});C.addEventListener('pointercancel',e=>{if(down){down=false;hover=null;draw();mapUpdate();drawCursor()}});
function local(n,x){return n.localName===x||(n.nodeName||'').split(':').pop()===x}function date(v){let d=new Date(v);return isNaN(d)?null:d}
function parseGPX(text){let xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw Error('GPX XML 格式无法解析');let nodes=[...xml.getElementsByTagNameNS('*','trkpt')];if(!nodes.length)nodes=[...xml.getElementsByTagName('*')].filter(n=>local(n,'trkpt'));return nodes.map(n=>{let get=x=>[...n.children].find(c=>local(c,x))?.textContent.trim(),sp=get('speed');return{lat:+n.getAttribute('lat'),lng:+n.getAttribute('lon'),ele:+get('ele'),time:date(get('time')),speed:Number.isFinite(+sp)?+sp*3.6:NaN}}).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng))}
function parseKML(text){let xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw Error('KML XML 格式无法解析');let o=[],ts=[...xml.getElementsByTagNameNS('*','Track')];if(!ts.length)ts=[...xml.getElementsByTagName('*')].filter(n=>local(n,'Track'));for(let t of ts){let when=[...t.children].filter(n=>local(n,'when')).map(n=>date(n.textContent.trim())),co=[...t.children].filter(n=>local(n,'coord')).map(n=>n.textContent.trim().split(/\s+/).map(Number));co.forEach((v,i)=>{if(Number.isFinite(v[0])&&Number.isFinite(v[1]))o.push({lng:v[0],lat:v[1],ele:v[2],time:when[i]||null,speed:NaN})})}if(o.length)return o;for(let l of [...xml.getElementsByTagNameNS('*','LineString')]){let z=[...l.children].find(n=>local(n,'coordinates'))?.textContent.trim()||'';z.split(/\s+/).forEach(x=>{let v=x.split(',').map(Number);if(Number.isFinite(v[0])&&Number.isFinite(v[1]))o.push({lng:v[0],lat:v[1],ele:v[2],time:null,speed:NaN})})}return o}
function parseFIT(buf){return new Promise((resolve,reject)=>{let P=window.FitParser;if(!P)return reject(Error('FIT 解析组件加载失败。请联网重新打开此页面后重试。'));try{let parser=new P({force:true,mode:'cascade',speedUnit:'km/h',lengthUnit:'m',elapsedRecordField:true});parser.parse(buf,(err,data)=>{if(err)return reject(err);let rec=(data.records||data.record||[]).map(r=>({lat:+(r.position_lat??r.positionLat),lng:+(r.position_long??r.positionLong),ele:+(r.altitude??r.enhanced_altitude),time:date(r.timestamp),speed:+(r.enhanced_speed??r.speed)})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));resolve(rec)})}catch(e){reject(e)}})}
async function load(file){let ext=(file.name.split('.').pop()||'').toLowerCase();if(ext==='fit')return parseFIT(await file.arrayBuffer());let t=await file.text();return ext==='gpx'?parseGPX(t):parseKML(t)}
document.getElementById('file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{status.textContent='正在解析 '+f.name+'…';pts=await load(f);if(pts.length<2)throw Error('没有找到至少两个有效轨迹点。');prepare();range=[0,pts.length-1];hover=null;status.textContent=`已读取 ${pts.length.toLocaleString()} 个轨迹点：${f.name}`;showWarnings();mapUpdate(true);draw();drawStats();detectStops()}catch(err){pts=[];range=null;status.textContent='读取失败：'+(err.message||err);warnings.innerHTML='';draw();drawStats();stopsEl.innerHTML='<span class="hint">无法识别停留点。</span>'}});
document.getElementById('reset').onclick=()=>pts.length&&apply(0,pts.length-1);document.getElementById('distMode').onclick=()=>{axis='distance';document.getElementById('distMode').classList.add('active');document.getElementById('timeMode').classList.remove('active');draw()};document.getElementById('timeMode').onclick=()=>{if(!pts.some(p=>p.time)){warnings.innerHTML='<div class="notice warn">没有时间信息，无法展示时间轴。</div>'+warnings.innerHTML;return}axis='time';document.getElementById('timeMode').classList.add('active');document.getElementById('distMode').classList.remove('active');draw()};new ResizeObserver(draw).observe(C);draw();
</script></body></html>
